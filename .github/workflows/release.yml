# Build Windows NSIS installer and publish to GitHub Releases.
# Tag releases on main after merging develop (see README).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.0); must match src-tauri/tauri.conf.json"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_type }}" -eq "tag" ? "${{ github.ref_name }}" : ""
          if ($tag -match '^v(.+)$') {
            $ver = $Matches[1]
          } elseif ("${{ inputs.version }}") {
            $ver = "${{ inputs.version }}".Trim()
          } else {
            $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $ver = $conf.version
          }
          if (-not $ver) { throw "Could not resolve release version" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (NSIS)
        run: npm run tauri:build

      - name: Stage installer
        id: installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $dir = "src-tauri/target/release/bundle/nsis"
          $built = Get-ChildItem -Path $dir -Filter "AreYouFocused_*_x64-setup.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $built) {
            throw "NSIS installer not found under $dir"
          }
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          $asset = "releases/AreYouFocused_${ver}_x64-setup.exe"
          Copy-Item -LiteralPath $built.FullName -Destination $asset
          "path=$asset" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AreYouFocused ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.installer.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
